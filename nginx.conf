# C:\master-proxy-infra\nginx.conf - FINAL WORKING VERSION

events {}

http {
    resolver 127.0.0.11 valid=5s;

    # --- Server Block for redirecting all HTTP to HTTPS ---
    server {
        listen 80;
        server_name chatdemo.levor.io;
        return 301 https://$host$request_uri;
    }

    # --- Server Block for handling the secure chatbot traffic ---
    server {
        listen 443 ssl;
        server_name chatdemo.levor.io;

        # SSL Certificate Configuration
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Location for the Chatbot
        location / {
            proxy_pass http://nginx-proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ======================= Psono password manager =======================
    server {
        listen 80;
        server_name pass.levor.io;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name pass.levor.io;

        ssl_certificate /etc/nginx/certs/pass.levor.io/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/pass.levor.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Real client IP from Cloudflare (file generated by deploy.yml).
        # Glob include: missing file => no real IP => admin paths deny all (fail closed).
        include /etc/nginx/generated/cf-realip*.conf;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; manifest-src 'self'; connect-src 'self' https://static.psono.com https://api.pwnedpasswords.com; font-src 'self'; img-src 'self' https://favicon.psono.com data:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'self'; frame-ancestors 'none'; child-src 'self'" always;

        client_max_body_size 10m;

        # Variable => resolved at request time, so proxy boots even if Psono is down.
        set $psono http://psono-combo:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_read_timeout 90;

        # Admin portal + admin API: admin IP only (allow list generated by deploy.yml).
        location ^~ /portal/ {
            include /etc/nginx/generated/psono-admin-allow*.conf;
            deny all;
            proxy_pass $psono;
        }
        location ^~ /server/admin/ {
            include /etc/nginx/generated/psono-admin-allow*.conf;
            deny all;
            proxy_pass $psono;
        }

        location / {
            proxy_pass $psono;
        }
    }
}