# C:\master-proxy-infra\.github\workflows\deploy.yml

name: Deploy Master Proxy

on:
  push:
    branches: ["master"]
  # Add a schedule to run this workflow automatically once a week
  schedule:
    - cron: "0 0 * * 1" # Runs every Monday at midnight UTC
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync Files to Server
        uses: easingthemes/ssh-deploy@35647dbb6c84e9f4c4ff546acffbfe40e5650576 # v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          SOURCE: "./"
          TARGET: "~/master-proxy-infra"
          EXCLUDE: "/.github/, /.git/"

      - name: Configure Server and Restart Proxy
        env:
          PSONO_ADMIN_IP: ${{ secrets.PSONO_ADMIN_IP }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: PSONO_ADMIN_IP
          script: |
            set -e
            cd ~/master-proxy-infra

            # --- NEW: Secure the firewall ---
            echo "Updating firewall to allow Cloudflare IPs..."
            # Make the script executable and run it with sudo
            chmod +x ./update-firewall.sh
            sudo ./update-firewall.sh
            echo "✅ Firewall configuration updated."

            echo "Generating nginx include files..."
            mkdir -p generated
            # Cloudflare real-IP list (only written if fetch looks sane)
            CF_IPS="$(curl -sf https://www.cloudflare.com/ips-v4; echo; curl -sf https://www.cloudflare.com/ips-v6)"
            if [ "$(echo "$CF_IPS" | grep -cE '^[0-9a-f:.]+/[0-9]+$')" -ge 10 ]; then
              { echo "$CF_IPS" | grep -E '^[0-9a-f:.]+/[0-9]+$' | sed 's/.*/set_real_ip_from &;/'
                echo "real_ip_header CF-Connecting-IP;"; } > generated/cf-realip.conf
            else
              echo "⚠️ Cloudflare IP fetch failed, keeping previous cf-realip.conf"
            fi
            # Psono admin allow list (secret PSONO_ADMIN_IP, comma/space separated IPs/CIDRs)
            : > generated/psono-admin-allow.conf
            for ip in $(echo "${PSONO_ADMIN_IP:-}" | tr ',' ' '); do
              if echo "$ip" | grep -qE '^[0-9a-fA-F:.]+(/[0-9]+)?$'; then
                echo "allow $ip;" >> generated/psono-admin-allow.conf
              else
                echo "⚠️ Skipping invalid PSONO_ADMIN_IP entry"
              fi
            done

            echo "Validating nginx config..."
            # Fails deploy (before restart) if config/certs are broken, e.g. pass.levor.io cert missing
            NGINX_IMAGE="$(grep -oE 'nginx:[0-9.]+-alpine' docker-compose.yml)"
            docker run --rm --network master_proxy_network \
              -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
              -v "$PWD/certs:/etc/nginx/certs:ro" \
              -v "$PWD/generated:/etc/nginx/generated:ro" \
              "$NGINX_IMAGE" nginx -t

            echo "Ensuring master proxy service is up..."
            docker compose up -d
            # Restart so the container picks up the re-synced nginx.conf (rsync replaces the file inode)
            docker compose restart master-proxy
            echo "Master proxy is running."
