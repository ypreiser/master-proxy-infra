# C:\master-proxy-infra\.github\workflows\keepalive.yml
#
# Scheduled workflows get auto-disabled after 60 days of no commit activity.
# All our monitoring is cron-based, so without this the alerts silently stop.
# Weekly check pushes an empty commit only when the last commit is >= 50 days
# old, resetting GitHub's inactivity clock before the 60-day cutoff.
# (Done inline; the popular keepalive-workflow action is TOS-blocked by GitHub.)

name: Keepalive

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit if repo idle >= 50 days
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit ${age_days}d ago."
          if [ "$age_days" -lt 50 ]; then
            echo "Under 50d, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (prevent scheduled-workflow auto-disable)"
          git push
