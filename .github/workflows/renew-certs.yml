# C:\master-proxy-infra\.github\workflows\renew-certs.yml

name: Weekly Certificate Sync

on:
  # Runs every Sunday at 1:00 AM UTC
  schedule:
    - cron: "0 1 * * 0"

  # This allows you to manually run the workflow from the GitHub Actions tab.
  workflow_dispatch:

jobs:
  renew-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Let's Encrypt Certificates
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Exit immediately if any command fails
            set -e

            echo "🔔 1/4: Attempting to renew certificates with Certbot..."
            # Stop master_proxy so certbot can bind port 80, restart after
            sudo certbot renew \
              --pre-hook "docker stop master_proxy" \
              --post-hook "docker start master_proxy"

            echo "🔄 2/4: Syncing renewed certificates to the proxy directory..."
            # --- THIS IS THE KEY FIX ---
            # Using the `sudo sh -c '...'` wrapper that you correctly identified,
            # to ensure shell globbing (*) works with sudo permissions.
            sudo sh -c 'cp -L /etc/letsencrypt/live/chatdemo.levor.io-0001/*.pem /home/dev1master/master-proxy-infra/certs/'

            echo "🔐 3/4: Setting correct file permissions..."
            # This ensures the files are owned by your user, which is good practice.
            sudo chown -R dev1master:dev1master /home/dev1master/master-proxy-infra/certs/

            echo "🚀 4/4: Gracefully reloading Nginx to use the new certificate..."
            # This command reloads Nginx inside the container without any downtime.
            docker exec master_proxy nginx -s reload

            echo "✅ Certificate sync and reload complete."

      - name: Notify success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "✅ Cert renewal completed successfully."

      - name: Notify failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: "❌ Cert renewal failed! Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
